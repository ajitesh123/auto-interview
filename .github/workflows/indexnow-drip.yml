name: IndexNow drip

# Every hour, tell IndexNow (Bing, Yandex, Seznam, Naver, Yep; Bing also feeds ChatGPT and
# Copilot search) about pages that changed in the last 7 days and were not sent since they
# changed. All such pages go in one request (the protocol allows 10,000 URLs per POST).
# Limits checked Nov 8, 2026 (indexnow.org documentation + FAQ, Yandex reference): no
# published daily cap; engines set private per-site thresholds; HTTP 429 = too many in a
# short time; don't resend unchanged URLs; wait 5–10 minutes before resending one URL.
# A cached state file records what was sent, so nothing is ever resent unchanged, and the
# script checks each page is live first (not-live pages retry next hour).
on:
  schedule:
    - cron: '23 * * * *' # every hour at :23 UTC (:53 IST)
  push:
    branches: [main]
    paths: ['.github/indexnow-kick'] # edit this file (its text = time window) to run once now
  workflow_dispatch:
    inputs:
      since:
        description: 'Git time window, e.g. "48 hours ago"'
        default: '7 days ago'
      max:
        description: 'Max URLs to submit this run (protocol max 10000)'
        default: '10000'

concurrency:
  group: indexnow-drip
  cancel-in-progress: false

jobs:
  drip:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Restore sent-URL state
        uses: actions/cache/restore@v4
        with:
          path: .indexnow-state.json
          key: indexnow-state-${{ github.run_id }}
          restore-keys: indexnow-state-
      - name: Submit changed pages
        run: |
          SINCE="${{ inputs.since || '7 days ago' }}"
          if [ "${{ github.event_name }}" = "push" ]; then SINCE="$(head -n1 .github/indexnow-kick)"; fi
          node scripts/indexnow-drip.mjs --since "$SINCE" --max "${{ inputs.max || '10000' }}" --gap 60000 --state .indexnow-state.json
      - name: Save sent-URL state
        if: always() && hashFiles('.indexnow-state.json') != ''
        uses: actions/cache/save@v4
        with:
          path: .indexnow-state.json
          key: indexnow-state-${{ github.run_id }}
